<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source health · MedSociety</title>
<style>
/* Colours from src/index.css (light :root, dark [data-theme=dark]). */
:root{--bg:#f5f5f3;--surface:#fff;--border:#e6e6e3;--border-strong:#cfcfcd;--text:#14161a;--muted:#5c6068;--faint:#6d7178;
  --accent:#0f6b52;--accent-dim:rgba(15,107,82,.09);--red:#a92f28;--red-dim:rgba(169,47,40,.09);--amber:#b5760a;--amber-dim:rgba(181,118,10,.10);--affil:#4b4396}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--surface:#1a1c20;--border:#26272b;--border-strong:#34363b;--text:#f2f2f0;--muted:#a0a3a8;--faint:#909399;
  --accent:#4fc79f;--accent-dim:rgba(79,199,159,.13);--red:#f08a7e;--red-dim:rgba(240,138,126,.13);--amber:#e0a73f;--amber-dim:rgba(224,167,63,.14);--affil:#aaa3f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 16px 64px;display:grid;gap:20px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.green{background:var(--accent-dim);color:var(--accent)}.red{background:var(--red-dim);color:var(--red)}.amber{background:var(--amber-dim);color:var(--amber)}.grey{background:var(--bg);color:var(--muted)}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted)}
.count{font-size:34px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.timer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
button{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--bg)}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text);min-width:min(320px,100%)}
.reasons{margin:10px 0 0;padding:10px 14px;border-radius:10px;background:var(--red-dim);color:var(--red);font-size:13.5px}
.reasons li{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.section{margin-top:16px;display:grid;gap:10px}
.empty{padding:22px;text-align:center;color:var(--muted)}
svg.spark{display:block}
@media (max-width:640px){.timer{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main>
  <header class="row spread">
    <div><h1>Source health</h1><div class="muted">MedSociety organization sources · local, read-only</div></div>
    <div class="faint" id="updated"></div>
  </header>
  <section class="panel" id="timer" aria-live="polite"><div class="empty">Loading…</div></section>
  <div id="sources" style="display:grid;gap:20px"></div>
</main>
<script>
"use strict";
var h = function (tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === "class") el.className = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  });
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
};
function add(el, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function (k) { add(el, k); }); return; }
  el.append(kid instanceof Node ? kid : String(kid));
}
var safeUrl = function (u) { return /^https?:\/\//i.test(u || "") ? u : null; };
var link = function (u, text) { var s = safeUrl(u); return s ? h("a", { href: s, target: "_blank", rel: "noopener noreferrer" }, text || s) : text || ""; };
var fmt = function (iso) { return iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—"; };
function ago(iso) {
  if (!iso) return "";
  var s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
var pill = function (status) {
  var map = { green: ["green", "Green"], red: ["red", "Red"], error: ["red", "Error"], skipped: ["grey", "Skipped"], none: ["grey", "Never run"] };
  var p = map[status] || ["grey", status];
  return h("span", { class: "pill " + p[0] }, p[1]);
};
function copyBtn(text) {
  return h("button", { type: "button", title: "Copy run ID", onclick: function (e) {
    navigator.clipboard && navigator.clipboard.writeText(text);
    e.currentTarget.textContent = "Copied";
  } }, "Copy");
}

var nextAt = null;
function countdown() {
  var el = document.getElementById("countdown");
  if (!el || !nextAt) return;
  var ms = Date.parse(nextAt) - Date.now();
  if (ms <= 0) { el.textContent = "due now"; return; }
  var s = Math.floor(ms / 1000), d = Math.floor(s / 86400);
  var pad = function (n) { return String(n).padStart(2, "0"); };
  el.textContent = (d ? d + "d " : "") + pad(Math.floor(s % 86400 / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
}
setInterval(countdown, 1000);

function renderTimer(o) {
  var sc = o.scheduler;
  nextAt = o.schedule.nextRunAt;
  var state = !sc ? h("span", { class: "pill amber" }, "Scheduler never started")
    : sc.running ? h("span", { class: "pill green" }, "Running a cycle now")
    : sc.alive ? h("span", { class: "pill green" }, "Waiting for the next slot")
    : h("span", { class: "pill red" }, "Scheduler not running");
  var last = sc && sc.lastCycle;
  var box = document.getElementById("timer");
  box.replaceChildren(
    h("div", { class: "timer" },
      h("div", {},
        h("div", { class: "row" }, h("h2", {}, "Weekly timer"), state),
        h("div", { class: "muted", style: "margin-top:4px" }, o.schedule.description),
        h("div", { class: "faint", style: "margin-top:2px;font-size:13px" },
          sc ? "Last heartbeat " + ago(sc.heartbeatAt) + " · started " + fmt(sc.startedAt)
             : "Start it with: docker compose up -d scheduler"),
        last ? h("div", { class: "row", style: "margin-top:10px" },
          h("span", { class: "faint", style: "font-size:13px" }, "Last cycle " + fmt(last.startedAt) + " (" + last.reason + "):"),
          last.results.map(function (r) { return h("span", { class: "chip" }, r.source + " · " + r.status + (r.entries != null ? " · " + r.entries : "")); })) : null),
      h("div", { style: "text-align:right" },
        h("div", { class: "faint", style: "font-size:12px;text-transform:uppercase;letter-spacing:.06em" }, "Next run in"),
        h("div", { class: "count mono", id: "countdown", style: "font-size:30px" }, "…"),
        h("div", { class: "muted", style: "font-size:13px" }, fmt(nextAt)))));
  countdown();
}

function spark(history) {
  var pts = history.slice().reverse();
  var W = 220, H = 44, P = 4;
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("class", "spark"); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Entries per run, oldest to newest: " + pts.map(function (p) { return p.entries; }).join(", "));
  if (!pts.length) return svg;
  var max = Math.max.apply(null, pts.map(function (p) { return p.entries; })) || 1;
  var x = function (i) { return pts.length === 1 ? W / 2 : P + i * (W - 2 * P) / (pts.length - 1); };
  var y = function (v) { return H - P - v / max * (H - 2 * P); };
  var line = document.createElementNS(ns, "polyline");
  line.setAttribute("points", pts.map(function (p, i) { return x(i) + "," + y(p.entries); }).join(" "));
  line.setAttribute("fill", "none"); line.setAttribute("stroke", "var(--accent)"); line.setAttribute("stroke-width", "2");
  svg.append(line);
  pts.forEach(function (p, i) {
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", x(i)); c.setAttribute("cy", y(p.entries)); c.setAttribute("r", p.status === "red" ? 4 : 2.5);
    c.setAttribute("fill", p.status === "red" ? "var(--red)" : "var(--accent)");
    var t = document.createElementNS(ns, "title"); t.textContent = fmt(p.startedAt) + ": " + p.entries + " (" + p.status + ")";
    c.append(t); svg.append(c);
  });
  return svg;
}

function targetsTable(src) {
  var latest = src.latest;
  var byKey = {};
  (latest ? latest.targets : []).forEach(function (t) { byKey[t.key] = t; });
  return h("div", { class: "scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, ["Website", "Region", "Entries", "Last fetched", "Status"].map(function (c) { return h("th", {}, c); }))),
    h("tbody", {}, src.targets.map(function (t) {
      var r = byKey[t.key];
      return h("tr", {},
        h("td", {}, h("div", {}, t.label), h("div", { style: "font-size:12.5px" }, link(t.url))),
        h("td", {}, t.region),
        h("td", { class: "mono" }, r ? r.count : "—"),
        h("td", {}, r && r.fetchedAt ? fmt(r.fetchedAt) : "—"),
        h("td", {}, r ? (r.ok ? pill("green") : h("span", {}, pill("red"), h("div", { style: "font-size:12.5px;margin-top:4px" }, r.error))) : pill("none")));
    }))));
}

function historyTable(src) {
  return h("div", { class: "scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, ["Started", "Run ID", "Status", "Entries", "Added", "Removed"].map(function (c) { return h("th", {}, c); }))),
    h("tbody", {}, src.history.map(function (r) {
      return h("tr", {}, h("td", {}, fmt(r.startedAt)), h("td", { class: "mono" }, r.id), h("td", {}, pill(r.status)),
        h("td", { class: "mono" }, r.entries), h("td", { class: "mono" }, "+" + r.added), h("td", { class: "mono" }, "−" + r.removed));
    }))));
}

function contentsPanel(src, host) {
  host.replaceChildren(h("div", { class: "empty" }, "Loading the last scrape…"));
  fetch("/api/run?source=" + encodeURIComponent(src.slug) + "&id=latest").then(function (r) { return r.json(); }).then(function (run) {
    if (!run || !run.entries) { host.replaceChildren(h("div", { class: "empty" }, "No run yet.")); return; }
    var rows = run.entries;
    var tbody = h("tbody");
    var shown = h("span", { class: "muted" });
    var draw = function (q) {
      q = (q || "").toLowerCase();
      var list = rows.filter(function (e) {
        return !q || [e.name, e.specialties.join(" "), e.sites.map(function (s) { return s.name; }).join(" "), e.externalId].join(" ").toLowerCase().indexOf(q) >= 0;
      });
      shown.textContent = list.length + " of " + rows.length;
      tbody.replaceChildren.apply(tbody, list.map(function (e) {
        return h("tr", {},
          h("td", {}, h("div", {}, (e.title ? e.title + " " : "") + e.name), h("div", { class: "faint mono" }, e.externalId)),
          h("td", {}, e.specialties.join(", ")),
          h("td", {}, e.sites.map(function (s) { return h("div", {}, s.name + (s.office ? " · office " + s.office : "")); })),
          h("td", {}, e.cedulas.length ? h("span", { class: "mono" }, e.cedulas.join(", ")) : h("span", { class: "faint" }, "—")),
          h("td", {}, e.region),
          h("td", {}, fmt(e.observedAt)),
          h("td", {}, link(e.url, "Profile ↗")));
      }));
    };
    host.replaceChildren(
      h("div", { class: "row spread" },
        h("div", { class: "row" }, h("strong", {}, "Last scrape"), pill(run.status), h("span", { class: "mono faint" }, run.id), copyBtn(run.id)),
        h("div", { class: "row" }, shown,
          h("input", { type: "search", placeholder: "Search name, specialty, hospital", "aria-label": "Search the last scrape", oninput: function (e) { draw(e.target.value); } }))),
      h("div", { class: "scroll" }, h("table", {},
        h("thead", {}, h("tr", {}, ["Name", "Specialties", "Hospital", "Cédula", "Region", "Observed", ""].map(function (c) { return h("th", {}, c); }))),
        tbody)));
    draw("");
  }).catch(function (err) { host.replaceChildren(h("div", { class: "reasons" }, "Could not load: " + err.message)); });
}

var open = {};
function renderSources(o) {
  var box = document.getElementById("sources");
  box.replaceChildren.apply(box, o.sources.map(function (src) {
    var l = src.latest;
    var status = l ? l.status : "none";
    var perm = src.permission;
    var history = h("div", { class: "section", hidden: !open[src.slug + ":h"] }, historyTable(src));
    var contents = h("div", { class: "section", hidden: !open[src.slug + ":c"] });
    if (open[src.slug + ":c"]) contentsPanel(src, contents);
    var toggle = function (key, el, label, fill) {
      return h("button", { type: "button", "aria-expanded": String(!!open[key]), onclick: function (e) {
        open[key] = !open[key]; el.hidden = !open[key]; e.currentTarget.setAttribute("aria-expanded", String(open[key]));
        if (open[key] && fill) fill();
      } }, label);
    };
    return h("article", { class: "panel" },
      h("div", { class: "row spread" },
        h("div", { class: "row" }, h("h2", {}, src.name), h("span", { class: "chip" }, src.kind),
          h("span", { class: "chip", title: perm ? perm.scope + ". " + perm.conditions : "" }, src.access === "open" ? "Open source" : perm ? "Permission " + perm.grantedOn : "Permission missing")),
        pill(status)),
      h("div", { class: "row muted", style: "margin-top:6px;font-size:13.5px" },
        l ? ["Last run " + fmt(l.startedAt) + " (" + ago(l.startedAt) + ")", h("span", { class: "mono faint" }, l.id), copyBtn(l.id)] : "Never run. npm run sources -- --source=" + src.slug),
      l && l.status !== "green" && src.lastGood ? h("div", { class: "muted", style: "font-size:13px" }, "Badges still use the last good run: " + fmt(src.lastGood.startedAt) + " · " + src.lastGood.id) : null,
      l && l.reasons.length ? h("ul", { class: "reasons" }, l.reasons.map(function (r) { return h("li", {}, r); })) : null,
      h("div", { class: "stats" },
        h("div", { class: "stat" }, h("b", {}, l ? l.counts.entries : "—"), h("span", {}, "entries in the last run")),
        h("div", { class: "stat" }, h("b", {}, l ? "+" + l.counts.added + " / −" + l.counts.removed : "—"), h("span", {}, "since the previous good run")),
        h("div", { class: "stat" }, h("b", {}, src.history.length), h("span", {}, "runs kept")),
        h("div", { class: "stat" }, spark(src.history), h("span", {}, "entries per run"))),
      h("div", { class: "section" }, targetsTable(src)),
      h("div", { class: "row", style: "margin-top:14px" },
        toggle(src.slug + ":c", contents, "Last scrape contents", function () { contentsPanel(src, contents); }),
        toggle(src.slug + ":h", history, "Run history")),
      contents, history);
  }));
}

var lastSig = null;
function load() {
  fetch("/api/overview").then(function (r) { return r.json(); }).then(function (o) {
    renderTimer(o);
    // Redraw the cards only when a run has landed, so an open search survives the refresh.
    var sig = o.sources.map(function (s) { return s.slug + ":" + (s.latest ? s.latest.id : ""); }).join("|");
    if (sig !== lastSig) { renderSources(o); lastSig = sig; }
    document.getElementById("updated").textContent = "Updated " + new Date(o.generatedAt).toLocaleTimeString();
  }).catch(function (err) {
    document.getElementById("timer").replaceChildren(h("div", { class: "reasons" }, "Dashboard server not reachable: " + err.message));
  });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
